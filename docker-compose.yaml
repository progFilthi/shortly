services:
  # =========================================================================
  # POSTGRESQL (Databases per Service)
  # =========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: shortly-postgres
    restart: always
    environment:
      POSTGRES_USER: shortly_admin
      POSTGRES_PASSWORD: shortly_password
      POSTGRES_DB: auth_db # Default initial database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docs/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortly_admin -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # REDIS (Caching & Feed Caching)
  # =========================================================================
  redis:
    # Pinned. `latest` means a Redis major upgrade can arrive on a redeploy, and a cache
    # protocol or persistence change across versions is a production incident nobody signed up for.
    image: redis:8-alpine
    container_name: shortly-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # RABBITMQ (Async Messaging & Event Broker)
  # =========================================================================
  rabbitmq:
    # Pinned for the same reason as Redis. An unpinned broker upgrade can change queue
    # semantics (classic vs quorum defaults have moved before) and silently alter delivery
    # guarantees the transcoder depends on.
    image: rabbitmq:4.1-management-alpine
    container_name: shortly-rabbitmq
    restart: always
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management Web UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================================
  # LOCALSTACK (Local S3-compatible object storage)
  # =========================================================================
  # Lets the whole upload and transcode pipeline run locally, which is the only way to exercise
  # presign -> PUT -> HeadObject -> transcode -> manifest without touching a real bucket.
  # LocalStack specifically because it implements S3 presigned PUT correctly; lighter
  # S3 mocks generally do not, and a mock that cannot sign is useless for this path.
  localstack:
    image: localstack/localstack:4
    container_name: shortly-localstack
    restart: always
    ports:
      - "4566:4566"  # S3 (and other AWS) APIs
    environment:
      SERVICES: s3
      # LocalStack's default; matches the credentials the services are configured with.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://localhost:4566/_localstack/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Creates the bucket and applies the CORS rule the presigned browser upload needs.
  # One-shot and idempotent, so it exits rather than becoming a service to keep alive.
  localstack-init:
    image: amazon/aws-cli:2.27.9
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - ./scripts/init-local-storage.sh:/init.sh:ro
      - ./docs/s3-cors.json:/cors.json:ro
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # =========================================================================
  # API GATEWAY (the only public entry point)
  # =========================================================================
  gateway:
    build:
      context: ./api-gateway
    container_name: shortly-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
    environment:
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-eFsq0fOMiOQS5N4jxIojFxBtUlQtZavskccXMHTnwM4xyArgfTNuDpNYW9enlP/c}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-only-internal-secret}
      AUTH_SERVICE_URI: http://auth-service:8081
      VIDEO_SERVICE_URI: http://video-service:8082
    ports:
      - "8080:8080"

  # =========================================================================
  # AUTH SERVICE
  # =========================================================================
  auth-service:
    build:
      context: ./auth-service
    container_name: shortly-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: shortly_admin
      DB_PASSWORD: shortly_password
      # Must be byte-identical to the gateway's. Shared, because a JWT cannot be verified
      # against a public key the services each hold privately without key distribution.
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-eFsq0fOMiOQS5N4jxIojFxBtUlQtZavskccXMHTnwM4xyArgfTNuDpNYW9enlP/c}
      # Overridable so the iOS client integration test can wait out a real
      # expiry instead of a 15-minute one. Production leaves this at 15m.
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      # Must be byte-identical to the gateway's, and must NOT be the signing secret.
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-only-internal-secret}
      REQUIRE_GATEWAY_SECRET: "true"
      BCRYPT_COST: ${BCRYPT_COST:-12}
      # Shortened from the 20s default so the e2e script can exercise grace-window tolerance and
      # reuse detection without sleeping 20s twice. Production should keep the real value.
      REFRESH_REUSE_GRACE: ${REFRESH_REUSE_GRACE:-PT4S}
    ports:
      # Published only so the e2e auth script can prove a direct call is refused. Remove in
      # production: the gateway is the only supported way in.
      - "8081:8081"

  # =========================================================================
  # TRANSCRIBER (FFmpeg worker - HLS ladder generation)
  # =========================================================================
  transcoder:
    build:
      context: ./transcoder-service
    container_name: shortly-transcoder
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_BUCKET: shortly-videos-bucket
      AWS_ENDPOINT_URL: http://localstack:4566
      CDN_DOMAIN: http://localhost:4566/shortly-videos-bucket
      TRANSCODER_WORK_DIR: /work
      # Must be <= vCPU/2. Each ffmpeg process wants every core, so oversubscribing here
      # makes every job slower without shortening the queue.
      TRANSCODER_CONCURRENCY: "2"
    deploy:
      resources:
        limits:
          # 4 CPUs: 2 concurrent jobs, so each x264 gets roughly half the box. Each ffmpeg
          # process will otherwise try to use every core and the two jobs fight.
          cpus: "4.0"
          # A 500 MB source plus a ~75 MB ladder, x2 concurrent, plus JVM and ffmpeg overhead.
          memory: 4G
    tmpfs:
      # Scratch space for ffmpeg. tmpfs is RAM-backed, so this bounds disk usage and keeps
      # segment writes off the container's writable layer. Sized for
      # concurrency x (largest source + ladder); 2G covers the configured limits with headroom.
      #
      # mode=1777 is required, not decorative: the container runs as the unprivileged
      # `transcoder` user, and a tmpfs mounted without an explicit mode is root-owned and
      # unwritable by it.
      - /work:size=2G,mode=1777

  # =========================================================================
  # VIDEO SERVICE (metadata, presigned upload, status)
  # =========================================================================
  video-service:
    build:
      context: ./video-service
    container_name: shortly-video-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: shortly_admin
      DB_PASSWORD: shortly_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_BUCKET: shortly-videos-bucket
      AWS_ENDPOINT_URL: http://localstack:4566
      CDN_DOMAIN: http://localhost:4566/shortly-videos-bucket
      # Rejects anything that did not arrive through the gateway, so the X-User-Id header is
      # only trusted when the gateway set it.
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-dev-only-internal-secret}
      REQUIRE_GATEWAY_SECRET: "true"
    ports:
      - "8082:8082"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  localstack_data:
