server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/auth/**

          - id: video-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/videos/**

          - id: interaction-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/v1/interactions/**

          - id: feed-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/v1/feed/**

          - id: notification-service
            uri: http://localhost:8086
            predicates:
              - Path=/api/v1/notifications/**

jwt:
  secret: ${JWT_SECRET}