server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.secret}
            - id: video-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/videos/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.secret}
            - id: interaction-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/interactions/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.secret}
            - id: feed-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/feed/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.secret}
            - id: notification-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.secret}

gateway:
  secret: ${JWT_SECRET}

jwt:
  secret: ${JWT_SECRET}