# Test-only overrides.
#
# The application context is loadable without a broker or a bucket, so a plain context-load
# smoke test does not need infrastructure. The listener container is not started, and AWS
# credentials are obviously fake.
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # Do not open an AMQP connection during tests.
        auto-startup: false

aws:
  region: us-east-1
  credentials:
    access-key: test
    secret-key: test

transcoder:
  # This test asserts the bean graph, not the media toolchain. The host's ffmpeg may differ
  # from the pinned image's (a macOS Homebrew build has no zscale, for example), and failing the
  # context load over that would make the test measure the wrong thing.
  verify-media-toolchain: false
  storage:
    bucket-name: test-bucket
    cdn-domain: https://cdn.test.invalid

logging:
  level:
    com.shortly.transcoderservice: INFO
