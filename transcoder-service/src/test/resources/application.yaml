# Test-only overrides.
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # Do not open an AMQP connection during tests.
        auto-startup: false

aws:
  region: us-east-1
  credentials:
    access-key: test
    secret-key: test

transcoder:
  # This test asserts the bean graph, not the media toolchain.
  verify-media-toolchain: false
  storage:
    bucket-name: test-bucket
    cdn-domain: https://cdn.test.invalid

logging:
  level:
    com.shortly.transcoderservice: INFO
