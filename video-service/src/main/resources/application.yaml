server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: video-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/video_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate, not update. ddl-auto:update let Hibernate invent and mutate the schema at
      # boot, which cannot express a rename or a narrowing and silently edits production on
      # startup. Flyway owns the schema now; this mode makes a drift between entity and
      # migration a startup failure rather than a runtime surprise.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Dialect is selected automatically from the JDBC connection. Naming it explicitly
        # logs a deprecation warning on every boot and pins the service to one database.

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    # This schema predates Flyway: it was created by hibernate.ddl-auto=update, so an existing
    # environment has a populated `videos` table and no schema history. Without baselining,
    # Flyway refuses to start on a non-empty schema and the service cannot be deployed at all.
    #
    # Baseline version 1 means V1 is treated as already applied (correct - the table exists)
    # and V2 and V3, which only ADD columns and widen types, run on top. The catch blocks are
    # what make this safe: a migration that would lose data fails the deploy rather than
    # quietly running.
    baseline-on-migrate: true
    baseline-version: 1

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # Without confirms, confirmUploadComplete returns 202 even when the broker never durably
    # accepted the event, and the video sits in PROCESSING forever with no job to run.
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        missing-queues-fatal: true

  servlet:
    multipart:
      # The service never receives file bytes - uploads go client-to-S3 - but a sane ceiling
      # here means a stray multipart POST cannot be used to exhaust the heap.
      max-file-size: 1MB
      max-request-size: 1MB

aws:
  region: ${AWS_REGION}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

video:
  bucket-name: ${AWS_S3_BUCKET}
  cdn-domain: ${CDN_DOMAIN}
  source-prefix: raw
  processed-prefix: hls
  # Ceiling on an uploaded original. Generous because the intended path is that the client
  # normalises on device first (15-40 MB). Enforced here at /complete via HeadObject and
  # again in the transcoder after probing, because only the transcoder can measure duration.
  max-upload-bytes: 500MB
  max-duration: 60s
  presign-ttl: 15m
  prefer-h264-from-clients: true

gateway:
  # Distinct from the JWT signing key. The gateway adds this to every routed request and this
  # service requires it, so a caller reaching this port directly cannot assert an identity.
  # It must be equal to the gateway's gateway.internal-secret.
  internal-secret: ${GATEWAY_INTERNAL_SECRET}
  require-secret: ${REQUIRE_GATEWAY_SECRET:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.shortly.videoservice: ${VIDEO_SERVICE_LOG_LEVEL:INFO}
