server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db
    username: ${DB_USER:shortly_admin}
    password: ${DB_PASSWORD:shortly_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate, not update. Flyway owns the schema; this makes a drift between entity and
      # migration a startup failure instead of a silent in-place edit at boot.
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    # This schema predates Flyway: it was created by hibernate.ddl-auto=update, so an existing
    # environment has a populated `users` table and no history. Baseline 1 treats that table as
    # already present; V2 onward only add columns and tables.
    baseline-on-migrate: true
    baseline-version: 1

  lifecycle:
    timeout-per-shutdown-phase: 30s

auth:
  # The access/refresh split. Access tokens are stateless JWTs and short, because there is no way
  # to revoke one before it expires - the expiry IS the revocation policy. Refresh tokens are
  # opaque, database-backed, and rotated on every use so a stolen one is detectable.
  access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}

  # Tolerates a client retrying a refresh whose response was lost. Without it, a dropped
  # connection burns the client's only copy of the token and it looks logged out at random.
  refresh-reuse-grace: ${REFRESH_REUSE_GRACE:PT20S}

  # Sign-in hardening.
  max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
  lockout-duration: ${LOCKOUT_DURATION:15m}
  bcrypt-cost: ${BCRYPT_COST:12}

  # Password policy: length only. Composition rules mostly produce "Passw0rd!".
  min-password-length: 10
  max-password-length: 128

  # Two distinct secrets. Sharing one would mean a leaked signing key also lets an attacker forge
  # the gateway header and impersonate any user id to internal services.
  signing-secret: ${JWT_SIGNING_SECRET}
  gateway-secret: ${GATEWAY_INTERNAL_SECRET}
  require-gateway-secret: ${REQUIRE_GATEWAY_SECRET:true}

  issuer: shortly

jwt:
  # Retained so the gateway and any future verifier read the same key name. Must stay equal to
  # auth.signing-secret.
  secret: ${JWT_SIGNING_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.shortly.authservice: ${AUTH_SERVICE_LOG_LEVEL:INFO}
